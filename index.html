<html>
    <head>
        <title>Srinika Blind Fold Chess Trainer</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.1/knockout-latest.js"></script>
    </head>
    <body>

        <div class="stopwatch">
            <div class="time" id="time">00:00:00</div>
        </div>

        <div class="input_tag">
            <input id="i_n_questions" type="number">
            <button id="go" onclick = "start()">Go!</button>
        </div>

        <div class="content">
            <h1 id="heading1">Blind Chess Trainer</h1>
            <h1 id="heading2">Colour of Squares</h1>
            <button id="w_button" onclick="w_button_click()"></button>
            <button id="b_button" onclick="b_button_click()"></button>
            <p id="p_score">Score : <strong id="score">0</strong>/<strong id="n_questions">0</strong></p>
        </div>

        <script src="script.js"></script>
    </body>
</html>
